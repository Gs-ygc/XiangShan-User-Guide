  - 概述: xsai-introduction.md
  - 微架构增量: xsai-microarchitecture.md
  - 指令集扩展: xsai-instruction-set.md
  - 数据寄存器: xsai-registers.md
  - 特权模式与控制状态寄存器: xsai-csr.md
  - 异常与中断: xsai-exception.md
  - 内存子系统与 HBL2: xsai-memory.md
  - 性能监测: xsai-pmu.md
  - 调试支持: xsai-debug.md
  - 仿真与调试:
      - 环境准备: sim-environment.md
      - Verilator 仿真: sim-verilator.md
      - VCS 仿真与用例框架: sim-vcs.md
      - 加速仿真（Palladium）: sim-acceleration.md
      - FPGA 上板与云平台: sim-fpga.md
      - 差分验证: debug-difftest.md
      - Checkpoint 与切片: debug-checkpoint.md
      - 常见故障排查: debug-troubleshooting.md
  - 软件开发:
